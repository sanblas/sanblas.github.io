name: Actualizar configuración SERPOAN

on:
  schedule:
    - cron: '17 */2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar configuración desde Apps Script
        run: |
          curl -L --fail --silent --show-error \
          "https://script.google.com/macros/s/AKfycbz3N01x7eP1km7SNnCwou0VAn26p82i8DQXoyOVweAVSTD4vuEGd4NnycdfGSgjF3wv/exec?api=config" \
          -o config-temp.json

      - name: Validar configuración
        run: |
          python - <<'PY'
          import json

          with open("config-temp.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("ok") is not True:
              raise SystemExit(
                  "Apps Script devolvió un error: "
                  + str(data.get("error", "error desconocido"))
              )

          print("Configuración válida")
          print("Generada:", data.get("generatedAt"))
          print("Versión:", data.get("version"))
          print("Destinos:", len(data.get("destinations", [])))

          warnings = data.get("warnings", [])

          if warnings:
              print("Advertencias:")
              for warning in warnings:
                  print("-", warning)
          PY

      - name: Generar config.js
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          APPS_SCRIPT_URL = (
              "https://script.google.com/macros/s/"
              "AKfycbz3N01x7eP1km7SNnCwou0VAn26p82i8DQXoyOVweAVSTD4vuEGd4NnycdfGSgjF3wv"
              "/exec"
          )

          with open("config-temp.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          config = {
              "appsScriptUrl": APPS_SCRIPT_URL,
              "fallbackUrl": "https://www.barcelo.com/",
              "generatedAt": data.get("generatedAt"),
              "version": data.get("version"),
              "destinations": data.get("destinations", [])
          }

          output = (
              "/* AUTO-GENERADO POR GITHUB ACTIONS\n"
              " * No editar manualmente.\n"
              " */\n\n"
              "window.SERPOAN_CONFIG = "
              + json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2
              )
              + ";\n"
          )

          path = Path("config.js")

          path.write_text(
              output,
              encoding="utf-8"
          )

          print("Generado:", path)
          PY

      - name: Mostrar config generado
        run: |
          echo "----- config.js -----"
          cat config.js
          echo "---------------------"

      - name: Eliminar archivo temporal
        run: |
          rm -f config-temp.json

      - name: Configurar Git
        run: |
          git config user.name "SERPOAN Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Comprobar cambios
        id: changes
        run: |
          git add config.js

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios en config.js"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios en config.js"
          fi

      - name: Guardar cambios
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "Actualizar configuración SERPOAN"
          git push